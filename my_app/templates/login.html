{% extends 'master/base.html' %}

{% block content %}

    {% if request.user.is_authenticated %}

    <section>
        welcome -- <b>
            {{request.user.username}}
        </b>
    </section>

    {% else %}
    <form action="." method="post">
        {% csrf_token %}
        {{form_data}}
        <button>
            {{title}}
        </button>
    </form>
    {% endif %}

{% endblock content %}
